<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Gestão Impressão 3D V2</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-950 text-white">

<header class="p-6 border-b border-slate-800">
    <h1 class="text-2xl font-bold">
        Gestão de Impressão 3D
    </h1>
</header>

<nav class="flex flex-wrap gap-2 p-4 border-b border-slate-800">

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('dashboard',this)">
Dashboard
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('clientes',this)">
Clientes
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('financeiro',this)">
Financeiro
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('orcamentos',this)">
Orçamentos
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('equipamentos',this)">
Equipamentos
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('estoque',this)">
Estoque
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('vitrine',this)">
Vitrine
</button>

<button class="tab-btn px-4 py-2 rounded bg-slate-900" onclick="switchTab('pedidos',this)">
Pedidos
</button>

</nav>


<main class="p-6">

<section id="tab-dashboard" class="tab-content">
<h2 class="text-xl font-bold">Dashboard</h2>

<div class="grid md:grid-cols-4 gap-4 mt-5">

<div class="bg-slate-900 p-5 rounded-xl">
Faturamento
<div id="dashboardFaturamento"></div>
</div>

<div class="bg-slate-900 p-5 rounded-xl">
Custos
<div id="dashboardCustos"></div>
</div>

<div class="bg-slate-900 p-5 rounded-xl">
Lucro
<div id="dashboardLucro"></div>
</div>

<div class="bg-slate-900 p-5 rounded-xl">
Margem
<div id="dashboardMargem"></div>
</div>

</div>

<div id="rankingProdutos" class="mt-6"></div>
</section>


<section id="tab-clientes" class="tab-content hidden">
<h2 class="text-xl font-bold">Clientes</h2>
<table class="w-full mt-5">
<tbody id="tabelaClientes"></tbody>
</table>
</section>


<section id="tab-financeiro" class="tab-content hidden">
<h2 class="text-xl font-bold">Financeiro</h2>
<div id="saldoFinanceiro" class="text-2xl mt-5"></div>
</section>


<section id="tab-orcamentos" class="tab-content hidden">
<h2 class="text-xl font-bold">Orçamentos</h2>
<div id="previewOrcamento" class="mt-5"></div>
</section>


<section id="tab-equipamentos" class="tab-content hidden">
<h2 class="text-xl font-bold">Equipamentos</h2>
<div id="gridImpressoras"></div>
<div id="gridEquipamentosExtras"></div>
</section>


<section id="tab-estoque" class="tab-content hidden">
<h2 class="text-xl font-bold">Almoxarifado</h2>
<div id="gridMateriasPrimas"></div>
<div id="gridInsumosExtras"></div>
</section>


<section id="tab-vitrine" class="tab-content hidden">
<h2 class="text-xl font-bold">Vitrine</h2>
<div id="gridVitrine"></div>
</section>


<section id="tab-pedidos" class="tab-content hidden">
<h2 class="text-xl font-bold">Pedidos</h2>

<table class="w-full">
<tbody id="tabelaPedidosCorpo"></tbody>
</table>

</section>


</main>


<script src="js/database.js"></script>
<script src="js/utils.js"></script>
<script src="js/equipamentos.js"></script>
<script src="js/almoxarifado.js"></script>
<script src="js/precificacao.js"></script>
<script src="js/vitrine.js"></script>
<script src="js/pedidos.js"></script>

<script src="js/dashboard.js"></script>
<script src="js/clientes.js"></script>
<script src="js/financeiro.js"></script>
<script src="js/orcamento.js"></script>
<script src="js/whatsapp.js"></script>

<script src="js/app.js"></script>

</body>
</html>
